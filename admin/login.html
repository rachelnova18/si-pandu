<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrator - Si-PANDU Banggai Laut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <style>
    .login-screen-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: radial-gradient(circle at top center, #16332c 0%, #0b1916 75%);
      position: relative;
    }
    .login-container-box {
      width: 100%;
      max-width: 440px;
      background: rgba(22, 51, 44, 0.75);
      border: 1px solid var(--admin-border-gold);
      border-radius: 24px;
      padding: 42px 36px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      text-align: center;
    }
    .login-logo-pill {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold-accent);
      background: rgba(212, 176, 123, 0.12);
      border: 1px solid rgba(212, 176, 123, 0.25);
      padding: 4px 14px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    .login-heading {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .login-sub {
      font-size: 0.86rem;
      color: rgba(229, 237, 245, 0.75);
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .login-form-item {
      text-align: left;
      margin-bottom: 18px;
    }
    .login-form-item label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 6px;
    }
    .login-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--admin-border);
      border-radius: 12px;
      color: #ffffff;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.25s ease;
    }
    .login-input:focus {
      border-color: var(--gold-accent);
      background: rgba(255, 255, 255, 0.08);
    }
    .btn-login-submit {
      width: 100%;
      padding: 13px;
      background: var(--gold-accent);
      color: #112621;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 10px;
    }
    .btn-login-submit:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
    }
    .login-demo-hint {
      margin-top: 20px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-size: 0.76rem;
      color: var(--text-dim);
      line-height: 1.5;
    }
    .login-demo-hint strong {
      color: var(--gold-light);
    }
    .login-back-link {
      margin-top: 22px;
      display: inline-block;
      font-size: 0.82rem;
      color: var(--gold-accent);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .login-back-link:hover {
      color: var(--gold-light);
      text-decoration: underline;
    }
    #loginMsg {
      margin-top: 14px;
      font-size: 0.85rem;
      font-weight: 600;
      min-height: 20px;
    }
  </style>
</head>
<body class="admin-body">

  <div class="login-screen-wrap">
    <div class="login-container-box">
      <span class="login-logo-pill">Si-PANDU Banggai Laut</span>
      <h1 class="login-heading">Login Administrator</h1>
      <p class="login-sub">Masuk ke Command Center untuk mengelola poster hero, direktori destinasi, dan jadwal kapal penyeberangan.</p>

      <form id="adminLoginForm">
        <div class="login-form-item">
          <label for="adminUser">Username Administrator</label>
          <input type="text" id="adminUser" class="login-input" required placeholder="Contoh: admin atau postgres" autocomplete="username">
        </div>

        <div class="login-form-item">
          <label for="adminPass">Kata Sandi / Password</label>
          <input type="password" id="adminPass" class="login-input" required placeholder="Masukkan kata sandi..." autocomplete="current-password">
        </div>

        <button type="submit" class="btn-login-submit" id="btnSubmitLogin">
          Masuk Command Center ➔
        </button>

        <div id="loginMsg"></div>
      </form>

      <div class="login-demo-hint">
        Kredensial Default Sistem:<br>
        Username: <strong>admin</strong> | Password: <strong>admin123</strong><br>
        (Atau akun database: <strong>postgres</strong> | <strong>bilkis21</strong>)
      </div>

      <a href="../index.html" class="login-back-link">← Kembali ke Portal Wisata Si-PANDU</a>
    </div>
  </div>

  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('adminUser').value.trim();
      const password = document.getElementById('adminPass').value.trim();
      const msg = document.getElementById('loginMsg');
      const submitBtn = document.getElementById('btnSubmitLogin');

      msg.style.color = '#94a3b8';
      msg.textContent = 'Memverifikasi kredensial...';
      submitBtn.disabled = true;

      // 1. Coba verifikasi ke backend API jika server aktif
      try {
        const response = await fetch('http://localhost:3000/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const result = await response.json();

        if (response.ok && result.status === 'success') {
          msg.style.color = '#2dd4bf';
          msg.textContent = 'Login berhasil! Mengalihkan ke dashboard...';
          localStorage.setItem('sipandu_admin_session', JSON.stringify({
            username: result.data?.username || username,
            loginAt: new Date().toISOString()
          }));
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
          return;
        }
      } catch (err) {
        // Backend offline -> periksa dengan kredensial default admin
      }

      // 2. Kredensial fallback bawaan
      if ((username === 'admin' && password === 'admin123') || 
          (username === 'postgres' && password === 'bilkis21')) {
        msg.style.color = '#2dd4bf';
        msg.textContent = 'Kredensial valid! Mengalihkan ke dashboard...';
        localStorage.setItem('sipandu_admin_session', JSON.stringify({
          username: username,
          role: 'Super Administrator',
          loginAt: new Date().toISOString()
        }));
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
      } else {
        msg.style.color = '#f87171';
        msg.textContent = 'Username atau kata sandi tidak cocok.';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
