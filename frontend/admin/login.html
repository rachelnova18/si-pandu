<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Si-PANDU</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .login-wrapper { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; background: #07090c; }
    .login-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(197,157,95,0.3); padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
    .login-card h2 { font-family: 'Playfair Display', serif; color: #fff; margin-bottom: 25px; text-align: center; font-size: 2rem; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.85rem; color: #ccc; margin-bottom: 8px; }
    .form-group input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; }
    .form-group input:focus { border-color: #c59d5f; }
    .login-submit { width: 100%; background: #c59d5f; color: #07090c; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: background 0.3s; }
    .login-submit:hover { background: #b0894e; }
    #loginMsg { margin-top: 15px; text-align: center; font-size: 0.85rem; }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <h2>Admin Login</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" required placeholder="Masukkan username admin">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="Masukkan password">
        </div>
        <button type="submit" class="login-submit">Masuk Dashboard</button>
        <p id="loginMsg"></p>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('loginMsg');

      try {
        const response = await fetch('http://localhost:3000/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const result = await response.json();

        if (response.ok && result.status === 'success') {
          msg.style.color = '#4ade80';
          msg.textContent = 'Login berhasil! Mengalihkan...';
          setTimeout(() => { window.location.href = 'index.html'; }, 1000);
        } else {
          msg.style.color = '#f87171';
          msg.textContent = result.message || 'Username atau password salah!';
        }
      } catch (err) {
        msg.style.color = '#f87171';
        msg.textContent = 'Gagal terhubung ke server backend.';
      }
    });
  </script>
</body>
</html>
